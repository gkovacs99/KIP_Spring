<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIP - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">

        <div class="col-md-4 p-0 d-none d-md-block">
            <img src="/images/Login.jpg" alt="KIP_login" class="w-100 h-100" style="object-fit: cover;">
        </div>

        <div class="col-md-8 d-flex align-items-center justify-content-center bg-light">

            <div class="w-50 p-5 bg-white shadow rounded">

                <img src="/images/KIP_LOGO.png" alt="KIP Logo" class="img-fluid d-block mx-auto mb-4" style="max-height: 150px;">

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email cím:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Jelszó:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-info w-100 py-2">Bejelentkezés</button>

                    <div class="mt-4 text-center">
                        <span class="text-muted d-block mb-2">Nincs még hozzáférése a rendszerhez?</span>
                        <a href="/register" class="btn btn-outline-info w-100 py-2">Fiók létrehozása</a>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
