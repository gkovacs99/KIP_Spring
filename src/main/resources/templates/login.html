<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIP - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" th:href="@{/css/root.css}">
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">

        <div class="col-md-4 p-0 d-none d-md-block">
            <img th:src="@{/images/Login.jpg}" alt="KIP_login" class="w-100 h-100" style="object-fit: cover;">
        </div>

        <div class="col-md-8 d-flex align-items-center justify-content-center bg-light">

            <div class="w-50 p-5 bg-white shadow rounded">

                <img th:src="@{/images/KIP_LOGO.png}" alt="KIP Logo" class="img-fluid d-block mx-auto mb-4" style="max-height: 150px;">

                <div th:if="${message}"
                     class="alert alert-success alert-dismissible fade show"
                     role="alert">

                    <span th:text="${message}"></span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Bezárás">
                    </button>
                </div>

                <form id="loginForm" th:action="@{/login}" th:object="${loginForm}" method="post">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email cím:</label>
                        <input type="email" class="form-control"
                               id="email" th:field="*{email}" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Jelszó:</label>
                        <input type="password" class="form-control"
                               id="password" th:field="*{password}" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Hibás e-mail cím vagy jelszó!
                    </div>

                    <button type="submit" class="btn btn-info w-100 py-2">
                        Bejelentkezés
                    </button>

                    <div class="mt-4 text-center">
                        <span class="text-muted d-block mb-2">Még nincs fiókja?</span>
                        <a href="/register" class="btn btn-outline-info w-100 py-2">Fiók létrehozása</a>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
