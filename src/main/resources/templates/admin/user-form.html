
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle}">Felhasználó</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>

        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/users}">
            Vissza a felhasználókhoz
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 fw-bold mb-4" th:text="${pageTitle}"></h1>

                    <div th:if="${error}" class="alert alert-danger">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/admin/users}"
                          th:object="${userForm}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <!-- Alapadatok -->

                        <h5 class="mb-3">Alapadatok</h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Teljes név</label>
                                <input type="text"
                                       id="name"
                                       class="form-control"
                                       th:field="*{name}"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="birthDate" class="form-label">
                                    Születési dátum
                                </label>
                                <input type="date"
                                       id="birthDate"
                                       class="form-control"
                                       th:field="*{birthDate}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">E-mail-cím</label>
                                <input type="email"
                                       id="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Telefonszám</label>
                                <input type="tel"
                                       id="phone"
                                       class="form-control"
                                       th:field="*{phone}"
                                       maxlength="20"
                                       required>
                            </div>

                            <div class="col-12 mb-3">
                                <label for="password" class="form-label">
                                    Jelszó
                                </label>

                                <input type="password"
                                       id="password"
                                       class="form-control"
                                       th:field="*{password}"
                                       autocomplete="new-password"
                                       th:required="${userForm.id == null}">

                                <div class="form-text"
                                     th:if="${userForm.id != null}">
                                    Csak akkor töltsd ki, ha módosítani szeretnéd
                                    a felhasználó jelszavát.
                                </div>

                                <div class="form-text"
                                     th:if="${userForm.id == null}">
                                    Új felhasználó esetén kötelező megadni.
                                </div>
                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- Jogosultságok -->

                        <h5 class="mb-3">Jogosultságok és hozzárendelések</h5>

                        <div class="mb-3">
                            <label for="roleId" class="form-label">
                                Szerepkör
                            </label>

                            <select id="roleId"
                                    class="form-select"
                                    th:field="*{roleId}"
                                    required>

                                <option value="">Válassz szerepkört...</option>

                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${role.name}"
                                        th:attr="data-role=${role.name}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="departmentId" class="form-label">
                                Osztály
                            </label>

                            <select id="departmentId"
                                    class="form-select"
                                    name="departmentId"
                                    th:field="*{departmentId}">

                                <option value="">Nincs hozzárendelve</option>

                                <option th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}">
                                </option>

                            </select>
                        </div>

                        <!-- Orvosi szakterület -->

                        <div class="mb-3" id="specializationGroup">
                            <label for="specializationId" class="form-label">
                                Szakterület
                            </label>

                            <select id="specializationId"
                                    class="form-select"
                                    th:field="*{specializationId}">

                                <option value="">Nincs megadva</option>

                                <option th:each="specialization : ${specializations}"
                                        th:value="${specialization.id}"
                                        th:text="${specialization.name}">
                                </option>

                            </select>
                        </div>

                        <!-- Rendelő az orvoskhoz vagy nővérekhetóz -->
                        <div class="mb-3" id="roomGroup">

                            <label for="roomId" class="form-label">
                                Rendelő / Szoba
                            </label>

                            <select class="form-select"
                                    id="roomId"
                                    name="roomId">

                                <option value="">Válassz szobát</option>

                                <option th:each="room : ${rooms}"
                                        th:value="${room.id}"
                                        th:data-department-id="${room.department.id}"
                                        th:text="${room.name}"
                                        th:selected="${userForm.roomId != null and userForm.roomId == room.id}">
                                </option>

                            </select>

                            <div class="form-text">
                                Csak a kiválasztott osztályhoz tartozó szobák jelennek meg.
                            </div>

                        </div>

                        <!-- Nővérhez rendelt orvos -->

                        <div class="mb-3" id="doctorGroup" th:if="${roles.?[name == 'NURSE'].![id].contains(userForm.roleId)}">
                            <label for="assignedDoctorId" class="form-label">
                                Hozzárendelt orvos
                            </label>

                            <select id="assignedDoctorId"
                                    class="form-select"
                                    th:field="*{assignedDoctorId}">

                                <option value="">Nincs hozzárendelve</option>

                                <option th:each="doctor : ${doctors}"
                                        th:value="${doctor.id}"
                                        th:text="${doctor.name}">
                                </option>

                            </select>
                        </div>

                        <hr class="my-4">

                        <!-- Aktív állapot -->

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="active"
                                   th:field="*{active}">

                            <label class="form-check-label" for="active">
                                Aktív felhasználó
                            </label>
                        </div>

                        <!-- Gombok -->

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/admin/users}"
                               class="btn btn-outline-secondary">
                                Mégse
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Mentés
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const departmentSelect = document.getElementById("departmentId");
        const roomSelect = document.getElementById("roomId");

        if (!departmentSelect || !roomSelect) {
            return;
        }

        // Az összes szoba eltárolása az eredeti HTML-elemekből.
        const allRoomOptions = Array.from(roomSelect.querySelectorAll(
            "option[data-department-id]"
        ));

        const placeholder = roomSelect.querySelector('option[value=""]')
            .cloneNode(true);

        function filterRooms() {

            const selectedDepartmentId = departmentSelect.value;
            const previouslySelectedRoom = roomSelect.value;

            // Régi opciók eltávolítása.
            roomSelect.replaceChildren();

            // Alapértelmezett opció visszaállítása.
            roomSelect.appendChild(placeholder.cloneNode(true));

            // Ha nincs kiválasztott osztály, nem választható szoba.
            if (!selectedDepartmentId) {
                roomSelect.disabled = true;
                return;
            }

            roomSelect.disabled = false;

            let previousRoomStillAvailable = false;

            allRoomOptions.forEach(function (option) {

                // Csak az adott osztályhoz tartozó szobákat jelenítjük meg.
                if (option.dataset.departmentId === selectedDepartmentId) {

                    const newOption = option.cloneNode(true);

                    roomSelect.appendChild(newOption);

                    if (newOption.value === previouslySelectedRoom) {
                        previousRoomStillAvailable = true;
                    }
                }
            });

            // Ha a korábban kiválasztott szoba nem tartozik az új osztályhoz,
            // töröljük a kiválasztását.
            if (previousRoomStillAvailable) {
                roomSelect.value = previouslySelectedRoom;
            } else {
                roomSelect.value = "";
            }
        }

        // Osztályválasztás figyelése.
        departmentSelect.addEventListener("change", filterRooms);

        // Oldalbetöltéskor is lefuttatjuk, hogy szerkesztésnél
        // a már hozzárendelt szoba megfelelően jelenjen meg.
        filterRooms();

    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
