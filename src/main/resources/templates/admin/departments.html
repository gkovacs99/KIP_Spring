
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Osztályok kezelése</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin}">Vissza</a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Osztályok</h1>
            <p class="text-muted mb-0">A kórházi osztályok kezelése.</p>
        </div>
        <a th:href="@{/admin/departments/new}" class="btn btn-primary">
            + Új osztály
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Osztály neve</th>
                        <th class="text-end">Műveletek</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="department : ${departments}">
                        <td th:text="${department.id}"></td>
                        <td class="fw-semibold" th:text="${department.name}"></td>
                        <td class="text-end">
                            <a th:href="@{/admin/departments/{id}/edit(id=${department.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Szerkesztés
                            </a>

                            <form th:action="@{/admin/departments/{id}/delete(id=${department.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Biztosan törölni szeretnéd ezt az osztályt?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Törlés
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(departments)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            Még nincs felvett osztály.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
