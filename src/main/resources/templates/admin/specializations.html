
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Specializációk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin}">Vissza</a>
    </div>
</nav>

<div class="container py-5">



    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Specializációk</h1>
            <p class="text-muted mb-0">Az orvosokhoz rendelhető szakterületek kezelése.</p>
        </div>
        <a th:href="@{/admin/specializations/new}" class="btn btn-primary">
            + Új specializáció
        </a>
    </div>

    <!-- Üzenetek -->

    <div th:if="${message}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${message}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <!-- Lista -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>Specializáció neve</th>
                        <th>Leírás</th>
                        <th class="text-end" style="width: 180px;">Műveletek</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="specialization : ${specializations}">

                        <td th:text="${specialization.id}"></td>

                        <td class="fw-semibold"
                            th:text="${specialization.name}">
                        </td>

                        <td th:text="${specialization.description != null
                                      ? specialization.description
                                      : '-'}">
                        </td>

                        <td class="text-end">

                            <a th:href="@{/admin/specializations/{id}/edit(id=${specialization.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Szerkesztés
                            </a>

                            <form th:action="@{/admin/specializations/{id}/delete(id=${specialization.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Biztosan törölni szeretnéd ezt a specializációt?');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Törlés
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(specializations)}">

                        <td colspan="4"
                            class="text-center text-muted py-4">
                            Még nincs rögzített specializáció.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-3">
        <a th:href="@{/admin}" class="btn btn-outline-secondary">
            Vissza az admin felületre
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
