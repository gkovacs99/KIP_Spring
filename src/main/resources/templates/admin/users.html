
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Felhasználók kezelése</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin}">Vissza</a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Felhasználók</h1>
            <p class="text-muted mb-0">A rendszer felhasználóinak kezelése.</p>
        </div>

        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            + Új felhasználó
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Név</th>
                        <th>E-mail</th>
                        <th>Telefonszám</th>
                        <th>Szerepkör</th>
                        <th>Állapot</th>
                        <th class="text-end">Műveletek</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>

                        <td class="fw-semibold" th:text="${user.name}"></td>

                        <td th:text="${user.email}"></td>

                        <td th:text="${user.phone}"></td>

                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${user.role.name}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${user.active}"
                                  class="badge bg-success">
                                Aktív
                            </span>

                            <span th:unless="${user.active}"
                                  class="badge bg-danger">
                                Inaktív
                            </span>
                        </td>

                        <td class="text-end text-nowrap">

                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Szerkesztés
                            </a>

                            <form th:if="${user.active}"
                                  th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Biztosan inaktiválni szeretnéd ezt a felhasználót?');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Inaktiválás
                                </button>
                            </form>

                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            Még nincs felhasználó.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
