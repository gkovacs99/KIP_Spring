
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Adminisztráció</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/dashboard}">Főoldal</a>
            <a class="nav-link active" th:href="@{/admin}">Adminisztráció</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">Adminisztráció</h1>
        <p class="text-muted">
            A rendszer adatainak és felhasználóinak kezelése.
        </p>
    </div>

    <div class="row g-4">

        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/dashboard}" class="text-decoration-none">
                <div class="card admin-card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="fs-1 mb-3">📊</div>
                        <h5 class="card-title text-dark">Dashboard</h5>
                        <p class="card-text text-muted">
                            Rendszerstatisztikák és áttekintés.
                        </p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/users}" class="text-decoration-none">
                <div class="card admin-card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="fs-1 mb-3">👥</div>
                        <h5 class="card-title text-dark">Felhasználók</h5>
                        <p class="card-text text-muted">
                            Felhasználók és jogosultságok kezelése.
                        </p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/rooms}" class="text-decoration-none">
                <div class="card admin-card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="fs-1 mb-3">🚪</div>
                        <h5 class="card-title text-dark">Szobák</h5>
                        <p class="card-text text-muted">
                            Helyiségek létrehozása és kezelése.
                        </p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/departments}" class="text-decoration-none">
                <div class="card admin-card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="fs-1 mb-3">🏥</div>
                        <h5 class="card-title text-dark">Osztályok</h5>
                        <p class="card-text text-muted">
                            Kórházi osztályok kezelése.
                        </p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
