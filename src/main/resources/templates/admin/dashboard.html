
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin}">
            Vissza az adminisztrációhoz
        </a>
    </div>
</nav>

<div class="container py-5">

    <h1 class="fw-bold mb-2">Dashboard</h1>
    <p class="text-muted mb-4">A rendszer aktuális állapota.</p>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <p class="text-muted mb-2">Felhasználók száma</p>
                    <h2 class="fw-bold" th:text="${userCount}">0</h2>
                    <a th:href="@{/admin/users}"
                       class="btn btn-sm btn-outline-primary mt-3">
                        Felhasználók kezelése
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <p class="text-muted mb-2">Osztályok száma</p>
                    <h2 class="fw-bold" th:text="${departmentCount}">0</h2>
                    <a th:href="@{/admin/departments}"
                       class="btn btn-sm btn-outline-primary mt-3">
                        Osztályok kezelése
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <p class="text-muted mb-2">Szobák száma</p>
                    <h2 class="fw-bold" th:text="${roomCount}">0</h2>
                    <a th:href="@{/admin/rooms}"
                       class="btn btn-sm btn-outline-primary mt-3">
                        Szobák kezelése
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
