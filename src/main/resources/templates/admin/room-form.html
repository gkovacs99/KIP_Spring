
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Szoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">KIP Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/rooms}">
            Vissza a szobákhoz
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h1 class="h3 fw-bold mb-4" th:text="${pageTitle}"></h1>

                    <form th:action="@{/admin/rooms}"
                          th:object="${room}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Szoba neve</label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   th:field="*{name}"
                                   maxlength="100"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="departmentId" class="form-label">
                                Osztály
                            </label>

                            <select class="form-select"
                                    id="departmentId"
                                    name="departmentId"
                                    required>

                                <option value="">Válassz osztályt...</option>

                                <option th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}"
                                        th:selected="${room.department != null and room.department.id == department.id}">
                                </option>

                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/rooms}"
                               class="btn btn-outline-secondary">
                                Mégse
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Mentés
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
