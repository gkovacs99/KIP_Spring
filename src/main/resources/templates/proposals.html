<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIP - Felajánlott időpontok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">KIP Rendszer</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white btn btn-info" href="/dashboard">Vissza a Vezérlőpultra</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-info">Felajánlott időpontok (Kérelmek)</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <p th:if="${#lists.isEmpty(proposals)}" class="p-4 text-muted mb-0">Jelenleg nincs felajánlott időpontja.</p>

            <div th:unless="${#lists.isEmpty(proposals)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Időpont</th>
                        <th>Részletek</th>
                        <th class="text-end">Műveletek</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="proposal : ${proposals}">
                        <td>
                            <strong th:text="${#temporals.format(proposal.startTime, 'yyyy.MM.dd. HH:mm')}">2026.11.20. 14:00</strong>
                        </td>
                        <td>Időpont módosítási javaslat</td>
                        <td class="text-end">
                            <form th:action="@{/proposals/{id}/accept(id=${proposal.id})}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-success btn-sm">Elfogadás</button>
                            </form>

                            <form th:action="@{/proposals/{id}/decline(id=${proposal.id})}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Elutasítás</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
