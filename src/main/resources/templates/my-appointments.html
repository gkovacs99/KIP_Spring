<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIP - Időpontjaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">KIP Rendszer</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white btn btn-info" href="/dashboard">Vissza a Vezérlőpultra</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="text-info">Új időpont foglalása</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/appointments}" method="POST">

                        <div class="mb-3">
                            <label for="doctorId" class="form-label">Orvos kiválasztása:</label>
                            <select class="form-select" id="doctorId" name="doctorId" required>
                                <option value="" selected disabled>Válasszon orvost...</option>
                                <option value="1">Dr. Kovács Gábor</option>
                                <option value="2">Dr. Szabó Anna</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="startTime" class="form-label">Dátum és időpont:</label>
                            <input type="datetime-local" class="form-control" id="startTime" name="startTime" required>
                        </div>

                        <button type="submit" class="btn btn-info w-100 text-white">Időpont lefoglalása</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="text-info">Lefoglalt időpontjaim</h4>
                </div>
                <div class="card-body p-0 mt-3">

                    <p th:if="${#lists.isEmpty(appointments)}" class="p-4 text-muted mb-0">Önnek jelenleg nincs lefoglalt időpontja.</p>

                    <div th:unless="${#lists.isEmpty(appointments)}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">Időpont</th>
                                <th>Orvos</th>
                                <th>Státusz</th>
                                <th class="text-end pe-4">Műveletek</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="appt : ${appointments}">
                                <td class="ps-4">
                                    <strong th:text="${#temporals.format(appt.startTime, 'yyyy.MM.dd. HH:mm')}">2026.11.20. 10:00</strong>
                                </td>
                                <td th:text="${appt.doctor.name}">Dr. Példa Orvos</td>
                                <td>
                                    <span class="badge bg-success" th:text="${appt.status}">BOOKED</span>
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/appointments/{id}/cancel(id=${appt.id})}" method="POST" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">Lemondás</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
