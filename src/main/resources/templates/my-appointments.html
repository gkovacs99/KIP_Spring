<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIP - Időpontjaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/script/my-appointments.js}" defer></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            KIP Rendszer
        </a>

        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white"
                       th:href="@{/dashboard}">
                        Vissza a vezérlőpultra
                    </a>
                </li>
            </ul>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <h2 class="text-info mb-4">Időpontjaim</h2>

    <!-- Üzenetek -->

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="row">

        <!-- Új időpont foglalása -->

        <div class="col-md-4 mb-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white pt-4 pb-0 border-0">
                    <h4 class="text-info">Új időpont foglalása</h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/my-appointments/book}"
                          method="POST">

                        <!-- Részleg -->

                        <div class="mb-3">

                            <label for="departmentId"
                                   class="form-label">
                                Részleg:
                            </label>

                            <select class="form-select"
                                    id="departmentId"
                                    required>

                                <option value="" selected disabled>
                                    Válasszon részleget...
                                </option>

                                <option th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}">
                                </option>

                            </select>

                        </div>


                        <!-- Orvos -->

                        <div class="mb-3">

                            <label for="doctorId"
                                   class="form-label">
                                Orvos:
                            </label>

                            <select class="form-select"
                                    id="doctorId"
                                    name="doctorId"
                                    required
                                    disabled>

                                <option value="" selected disabled>
                                    Először válasszon részleget...
                                </option>

                            </select>

                        </div>


                        <!-- Szabad időpont -->

                        <div class="mb-4">

                            <label for="startTime"
                                   class="form-label">
                                Szabad időpont:
                            </label>

                            <select class="form-select"
                                    id="startTime"
                                    name="startTime"
                                    required
                                    disabled>

                                <option value="" selected disabled>
                                    Először válasszon orvost...
                                </option>

                            </select>

                            <div class="form-text">
                                Egy időpont időtartama 30 perc.
                            </div>

                        </div>


                        <button type="submit"
                                id="bookButton"
                                class="btn btn-info w-100 text-white"
                                disabled>

                            Időpont lefoglalása

                        </button>

                    </form>

                </div>
            </div>
        </div>


        <!-- Lefoglalt időpontok -->

        <div class="col-md-8 mb-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white pt-4 pb-0 border-0">
                    <h4 class="text-info">
                        Lefoglalt időpontjaim
                    </h4>
                </div>

                <div class="card-body p-0 mt-3">

                    <p th:if="${#lists.isEmpty(appointments)}"
                       class="p-4 text-muted mb-0">

                        Önnek jelenleg nincs lefoglalt időpontja.

                    </p>


                    <div th:unless="${#lists.isEmpty(appointments)}"
                         class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">

                            <tr>
                                <th class="ps-4">Időpont</th>
                                <th>Orvos</th>
                                <th>Részleg</th>
                                <th>Státusz</th>
                                <th class="text-end pe-4">Műveletek</th>
                            </tr>

                            </thead>


                            <tbody>

                            <tr th:each="appt : ${appointments}">

                                <td class="ps-4">

                                    <strong th:text="${#temporals.format(appt.startTime, 'yyyy.MM.dd. HH:mm')}">
                                    </strong>

                                    <div class="text-muted small"
                                         th:text="${#temporals.format(appt.endTime, 'HH:mm')}">
                                    </div>

                                </td>


                                <td th:text="${appt.doctor.name}">
                                </td>


                                <td th:text="${appt.doctor.department != null ? appt.doctor.department.name : '-'}">
                                </td>


                                <td>

                                    <span th:if="${appt.status.name() == 'BOOKED'}"
                                          class="badge bg-success">
                                        Lefoglalva
                                    </span>

                                    <span th:if="${appt.status.name() == 'CANCELLED'}"
                                          class="badge bg-secondary">
                                        Lemondva
                                    </span>

                                </td>


                                <td class="text-end pe-4">

                                    <form th:if="${appt.status.name() != 'CANCELLED'}"
                                          th:action="@{/my-appointments/{id}/cancel(id=${appt.id})}"
                                          method="POST"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-outline-danger btn-sm"
                                                onclick="return confirm('Biztosan le szeretné mondani az időpontot?')">

                                            Lemondás

                                        </button>

                                    </form>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

</script>

</body>
</html>
